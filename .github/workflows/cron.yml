name: Daily Video Update

on:
  schedule:
    # 毎日 UTC 01:17 (日本時間 10:17) に実行
    - cron: '17 1 * * *'
  workflow_dispatch:
   # 手動実行用ボタン

jobs:
  update-daily-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Low View Videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-videos.js

      - name: Commit and Push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/daily.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily 5 videos [skip ci]" && git push)
